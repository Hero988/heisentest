<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px;
        background: #101014; color: #ececf1;
        font-family: ui-sans-serif, system-ui, sans-serif;
        display: flex; align-items: center;
        padding: 80px;
      }
      .bars { display: flex; align-items: flex-end; gap: 14px; height: 220px; margin-right: 72px; }
      .bars i { width: 34px; border-radius: 8px; background: #3a3a44; display: block; }
      .wordmark { font-size: 44px; font-weight: 700; letter-spacing: -0.01em; }
      .wordmark span { color: #8f88ff; }
      h1 { font-size: 74px; line-height: 1.04; letter-spacing: -0.02em; margin: 18px 0 26px; font-weight: 700; }
      p { font-size: 30px; color: #8b8b96; }
      p strong { color: #4ade80; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="bars">
      <i style="height: 38%"></i>
      <i style="height: 52%"></i>
      <i style="height: 44%; background: #e3b341"></i>
      <i style="height: 96%; background: #ff5c7a"></i>
      <i style="height: 60%; background: #8f88ff"></i>
      <i style="height: 34%"></i>
    </div>
    <div>
      <div class="wordmark"><span>h</span>eisentest</div>
      <h1>Open huge log files<br />in your browser.</h1>
      <p>Timeline · filters · multi-file correlation. <strong>Nothing is uploaded.</strong></p>
    </div>
  </body>
</html>
